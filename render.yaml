# Render Blueprint for the FastAPI backend (see https://render.com/docs/blueprint-spec).
# Deploy: connect this repo on Render, "New +" -> "Blueprint", pick this file. Fill in the
# `sync: false` env vars in the Render dashboard after the first deploy (they're secrets /
# deployment-specific and intentionally not stored in this file).
#
# This only defines the API. The web app is deployed separately on Vercel (Root Directory:
# web) — see README "クラウドへのデプロイ".
services:
  - type: web
    name: hu-guidebook-api
    runtime: python
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        sync: false # Supabase connection string
      - key: COHERE_API_KEY
        sync: false
      - key: COHERE_CHAT_MODEL
        value: command-r-08-2024
      - key: COHERE_EMBED_MODEL
        value: embed-multilingual-v3.0
      - key: COHERE_RERANK_MODEL
        value: rerank-multilingual-v3.0
      - key: COHERE_TIMEOUT_SECONDS
        value: "20"
      - key: EMBEDDING_DIMENSIONS
        value: "1024"
      - key: CORS_ALLOW_ORIGINS
        sync: false # comma-separated; include the Vercel URL once the web app is deployed
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
